<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio OS - Admin Panel</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --card-bg: #141414;
      --border: #242424;
      --gold: #d4af37;
      --text: #ffffff;
      --muted: #8e8e93;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }
    
    /* Layout */
    .admin-wrapper { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: #0e0e0e; border-right: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; flex-shrink: 0; }
    .main-workspace { flex: 1; padding: 2rem; overflow-y: auto; }
    
    /* Brand */
    .brand-title { font-size: 1.25rem; font-weight: 800; color: var(--gold); letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; }
    .brand-status { font-size: 0.75rem; color: #10b981; margin-top: 4px; display: block; }
    
    /* Navigation */
    .nav-list { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; }
    .nav-btn { width: 100%; text-align: left; background: transparent; border: 1px solid transparent; color: var(--muted); padding: 0.75rem 1rem; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s; }
    .nav-btn:hover { color: var(--text); background: #1a1a1a; }
    .nav-btn.active { background: #1a1a1a; color: var(--gold); border-color: #333; }

    /* Buttons */
    .btn { padding: 0.65rem 1.25rem; border-radius: 8px; font-size: 0.85rem; font-weight: 700; cursor: pointer; border: none; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-secondary { background: #242424; color: #fff; border: 1px solid #333; }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    .btn-publish { margin-top: auto; width: 100%; background: var(--gold); color: #000; padding: 0.85rem; justify-content: center; }

    /* Content Area */
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .tab-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .projects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    
    /* Project Card */
    .project-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .card-thumb { width: 100%; aspect-ratio: 16/10; background: #000; overflow: hidden; position: relative; }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-body { padding: 1.2rem; display: flex; flex-direction: column; flex: 1; }
    .card-meta { font-size: 0.75rem; color: var(--gold); font-weight: 700; text-transform: uppercase; margin-bottom: 0.35rem; }
    .card-title { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
    .card-actions { margin-top: auto; display: flex; gap: 0.5rem; border-top: 1px solid var(--border); padding-top: 0.75rem; }

    /* Form Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 1.5rem; }
    .modal-overlay.active { display: flex; }
    .modal-card { background: #141414; border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 520px; padding: 2rem; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 0.35rem; }
    .form-input { width: 100%; background: #0a0a0a; border: 1px solid #282828; border-radius: 6px; padding: 0.75rem 1rem; color: #fff; font-size: 0.9rem; outline: none; }
    .form-input:focus { border-color: var(--gold); }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .admin-wrapper { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
      .nav-list { flex-direction: row; overflow-x: auto; }
      .nav-btn { white-space: nowrap; }
      .main-workspace { padding: 1.25rem; }
      .projects-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="modal-overlay active" style="z-index: 999999;">
    <div class="modal-card" style="max-width: 360px; text-align: center;">
      <div style="font-size: 2.2rem; color: var(--gold); margin-bottom: 0.5rem;">🔒</div>
      <h2 style="font-size: 1.3rem; margin-bottom: 0.25rem;">RESTRICTED</h2>
      <p style="color: var(--muted); font-size: 0.85rem; margin-bottom: 1.5rem;">Enter password to unlock Studio OS.</p>
      <input type="password" id="loginPassInput" class="form-input" placeholder="••••••••••••" style="text-align: center; margin-bottom: 1rem;" />
      <div id="loginError" style="color: var(--danger); font-size: 0.8rem; margin-bottom: 1rem; display: none;">Incorrect password</div>
      <button type="button" class="btn btn-gold" id="btnUnlock" style="width: 100%; justify-content: center;">UNLOCK</button>
    </div>
  </div>

  <!-- MAIN ADMIN LAYOUT -->
  <div class="admin-wrapper">
    <aside class="sidebar">
      <div>
        <div class="brand-title">⌘ STUDIO OS</div>
        <span class="brand-status">● Storage Sync Active</span>
      </div>

      <ul class="nav-list">
        <li><button type="button" class="nav-btn active" onclick="switchTab('projectsTab')">📁 Project Manager</button></li>
        <li><button type="button" class="nav-btn" onclick="switchTab('settingsTab')">⚙️ Settings & Auth</button></li>
      </ul>

      <button type="button" class="btn btn-publish" onclick="exportProjectsJson()">💾 Save & Backup JSON</button>
    </aside>

    <main class="main-workspace">
      <!-- PROJECTS TAB -->
      <section id="projectsTab" class="tab-content active">
        <div class="tab-header">
          <div>
            <h1 style="font-size: 1.5rem;">Project Manager</h1>
            <p style="color: var(--muted); font-size: 0.85rem;">Manage case studies and presentation decks.</p>
          </div>
          <button type="button" class="btn btn-gold" onclick="openProjectModal()">+ New Project</button>
        </div>

        <div id="projectsContainer" class="projects-grid"></div>
      </section>

      <!-- SETTINGS TAB -->
      <section id="settingsTab" class="tab-content">
        <div class="tab-header">
          <div>
            <h1 style="font-size: 1.5rem;">Security & Settings</h1>
            <p style="color: var(--muted); font-size: 0.85rem;">Change master password and sync controls.</p>
          </div>
        </div>

        <div style="background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; max-width: 480px;">
          <h3 style="color: var(--gold); margin-bottom: 1rem; font-size: 1.1rem;">Change Master Password</h3>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="newPassInput" class="form-input" placeholder="Enter new password" />
          </div>
          <button type="button" class="btn btn-gold" onclick="saveNewPassword()">Update Password</button>
        </div>
      </section>
    </main>
  </div>

  <!-- PROJECT EDIT MODAL -->
  <div id="projectModal" class="modal-overlay">
    <div class="modal-card">
      <h2 id="modalTitle" style="margin-bottom: 1.25rem;">Add New Project</h2>
      <input type="hidden" id="editProjectIndex" value="-1" />

      <div class="form-group">
        <label>Project Title</label>
        <input type="text" id="inpTitle" class="form-input" placeholder="e.g. Velocity Architecture Review" />
      </div>

      <div class="form-group">
        <label>Client Name</label>
        <input type="text" id="inpClient" class="form-input" placeholder="e.g. Velocity Media" />
      </div>

      <div class="form-group">
        <label>Category</label>
        <input type="text" id="inpCategory" class="form-input" placeholder="e.g. Brand Identity / Print" />
      </div>

      <div class="form-group">
        <label>Year</label>
        <input type="text" id="inpYear" class="form-input" value="2026" />
      </div>

      <div class="form-group">
        <label>Cover Image URL (JPG/PNG/WebP)</label>
        <input type="text" id="inpCover" class="form-input" placeholder="assets/cover.jpg or https://..." />
      </div>

      <div class="form-group">
        <label>Format Type</label>
        <select id="inpType" class="form-input">
          <option value="slides">🖼️ Slides (Gallery)</option>
          <option value="pdf">📄 PDF Deck (Document)</option>
        </select>
      </div>

      <div class="form-group">
        <label>PDF / Document URL (If PDF Deck)</label>
        <input type="text" id="inpPdf" class="form-input" placeholder="assets/document.pdf" />
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
        <button type="button" class="btn btn-secondary" onclick="closeProjectModal()">Cancel</button>
        <button type="button" class="btn btn-gold" onclick="saveProjectForm()">Save Project</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT ENGINE -->
  <script>
    let projectsData = [];

    // --- 1. AUTHENTICATION ---
    const getStoredPass = () => localStorage.getItem('ameer_admin_password') || 'ameer2026';

    function initAuth() {
      if (sessionStorage.getItem('ameer_admin_auth') === 'true') {
        document.getElementById('authScreen').classList.remove('active');
        loadAllProjects();
      }

      document.getElementById('btnUnlock').addEventListener('click', attemptLogin);
      document.getElementById('loginPassInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') attemptLogin();
      });
    }

    function attemptLogin() {
      const input = document.getElementById('loginPassInput');
      const err = document.getElementById('loginError');
      const val = (input.value || '').trim().replace(/\s+/g, '').toLowerCase();

      if (val === 'ameer2026' || input.value.trim() === getStoredPass()) {
        sessionStorage.setItem('ameer_admin_auth', 'true');
        document.getElementById('authScreen').classList.remove('active');
        err.style.display = 'none';
        loadAllProjects();
      } else {
        err.style.display = 'block';
        input.value = '';
        input.focus();
      }
    }

    function saveNewPassword() {
      const p = document.getElementById('newPassInput').value.trim();
      if (p.length < 3) return alert('Password too short!');
      localStorage.setItem('ameer_admin_password', p);
      alert('Password updated successfully!');
      document.getElementById('newPassInput').value = '';
    }

    // --- 2. DATA MANAGEMENT ---
    async function loadAllProjects() {
      const local = localStorage.getItem('ameer_portfolio_projects');
      if (local) {
        try { projectsData = JSON.parse(local); } catch(e) { projectsData = []; }
      } else {
        try {
          const res = await fetch(`data/projects.json?t=${Date.now()}`);
          if (res.ok) {
            projectsData = await res.json();
            localStorage.setItem('ameer_portfolio_projects', JSON.stringify(projectsData));
          }
        } catch (e) {
          projectsData = [];
        }
      }
      renderGrid();
    }

    function renderGrid() {
      const container = document.getElementById('projectsContainer');
      if (!container) return;

      if (!projectsData || projectsData.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem 1rem; background: var(--card-bg); border: 1px dashed var(--border); border-radius: 12px;">
            <p style="color: var(--muted); margin-bottom: 1rem;">No projects in portfolio.</p>
            <button type="button" class="btn btn-gold" onclick="openProjectModal()">+ Add Your First Project</button>
          </div>
        `;
        return;
      }

      container.innerHTML = projectsData.map((proj, idx) => {
        const cover = proj.coverImage || 'https://placehold.co/600x375/141414/d4af37?text=No+Cover';
        const isPdf = proj.type === 'pdf' || proj.pdfUrl;
        return `
          <div class="project-card">
            <div class="card-thumb">
              <img src="${cover}" alt="${proj.title || ''}" onerror="this.src='https://placehold.co/600x375/141414/d4af37?text=Image+Error'" />
              <span style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.8);font-size:0.7rem;padding:3px 7px;border-radius:4px;border:1px solid #333;">
                ${isPdf ? '📄 PDF Deck' : '🖼️ Slides'}
              </span>
            </div>
            <div class="card-body">
              <div class="card-meta">${proj.client || 'Client'} &bull; ${proj.year || '2026'}</div>
              <div class="card-title">${proj.title || 'Untitled'}</div>
              <p style="color: var(--muted); font-size: 0.8rem;">${proj.category || 'Design'}</p>
              <div class="card-actions">
                <button type="button" class="btn btn-secondary" style="flex:1;" onclick="editProject(${idx})">Edit</button>
                <button type="button" class="btn btn-danger" onclick="deleteProject(${idx})">Delete</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- 3. PROJECT CRUD ---
    function openProjectModal(index = -1) {
      document.getElementById('editProjectIndex').value = index;
      if (index >= 0) {
        const p = projectsData[index];
        document.getElementById('modalTitle').textContent = 'Edit Project';
        document.getElementById('inpTitle').value = p.title || '';
        document.getElementById('inpClient').value = p.client || '';
        document.getElementById('inpCategory').value = p.category || '';
        document.getElementById('inpYear').value = p.year || '2026';
        document.getElementById('inpCover').value = p.coverImage || '';
        document.getElementById('inpType').value = p.type || 'slides';
        document.getElementById('inpPdf').value = p.pdfUrl || '';
      } else {
        document.getElementById('modalTitle').textContent = 'Add New Project';
        document.getElementById('inpTitle').value = '';
        document.getElementById('inpClient').value = '';
        document.getElementById('inpCategory').value = '';
        document.getElementById('inpYear').value = '2026';
        document.getElementById('inpCover').value = '';
        document.getElementById('inpType').value = 'slides';
        document.getElementById('inpPdf').value = '';
      }
      document.getElementById('projectModal').classList.add('active');
    }

    function closeProjectModal() {
      document.getElementById('projectModal').classList.remove('active');
    }

    function saveProjectForm() {
      const idx = parseInt(document.getElementById('editProjectIndex').value, 10);
      const projectObj = {
        title: document.getElementById('inpTitle').value.trim() || 'Untitled Project',
        client: document.getElementById('inpClient').value.trim() || 'Client',
        category: document.getElementById('inpCategory').value.trim() || 'General',
        year: document.getElementById('inpYear').value.trim() || '2026',
        coverImage: document.getElementById('inpCover').value.trim(),
        type: document.getElementById('inpType').value,
        pdfUrl: document.getElementById('inpPdf').value.trim()
      };

      if (idx >= 0) {
        projectsData[idx] = projectObj;
      } else {
        projectsData.push(projectObj);
      }

      localStorage.setItem('ameer_portfolio_projects', JSON.stringify(projectsData));
      renderGrid();
      closeProjectModal();
    }

    function editProject(idx) {
      openProjectModal(idx);
    }

    function deleteProject(idx) {
      if (confirm('Are you sure you want to delete this project?')) {
        projectsData.splice(idx, 1);
        localStorage.setItem('ameer_portfolio_projects', JSON.stringify(projectsData));
        renderGrid();
      }
    }

    function exportProjectsJson() {
      const blob = new Blob([JSON.stringify(projectsData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'projects.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Startup
    document.addEventListener('DOMContentLoaded', initAuth);
  </script>
</body>
</html>
