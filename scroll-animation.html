<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ameer Suhail — Smooth Scroll Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: #000000;
      color: #ffffff;
      height: auto;
      overflow-x: hidden;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      min-height: 450vh;
      height: 450vh;
      overflow-x: hidden;
      touch-action: pan-y;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Fixed Fullscreen Canvas Viewport */
    .canvas-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 10;
      cursor: ns-resize;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Minimal Top Progress Bar */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: #cdf863;
      box-shadow: 0 0 10px rgba(205, 248, 99, 0.6);
      z-index: 100;
      transition: width 0.1s linear, opacity 0.4s ease;
      pointer-events: none;
    }

    .progress-bar.loaded {
      opacity: 0;
    }
  </style>
</head>
<body>

  <!-- Loading Bar -->
  <div class="progress-bar" id="progressBar"></div>

  <!-- Fullscreen Interactive Canvas -->
  <div class="canvas-viewport" id="viewport">
    <canvas id="portraitCanvas"></canvas>
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('portraitCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const viewport = document.getElementById('viewport');
      const progressBar = document.getElementById('progressBar');

      const TOTAL_FRAMES = 240;
      const images = new Array(TOTAL_FRAMES);
      const loadedFrames = new Set();

      // Normalized Progress (0.0 to 1.0)
      let targetProgress = 0;
      let currentProgress = 0;
      let lastRenderedFrame = -1;

      // URL generator: ezgif-frame-001.jpg -> ezgif-frame-240.jpg
      function getFrameUrl(idx) {
        const num = String(idx + 1).padStart(3, '0');
        return `assets/portrait-frames/ezgif-frame-${num}.jpg`;
      }

      // Responsive Retina Canvas Resizing
      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
        renderCurrent();
      }

      window.addEventListener('resize', resizeCanvas, { passive: true });

      // Find nearest loaded frame so canvas NEVER goes blank
      function getBestAvailableImage(targetIdx) {
        if (loadedFrames.has(targetIdx)) return images[targetIdx];

        // Search outward for closest loaded neighbor
        for (let offset = 1; offset < TOTAL_FRAMES; offset++) {
          const prev = targetIdx - offset;
          if (prev >= 0 && loadedFrames.has(prev)) return images[prev];

          const next = targetIdx + offset;
          if (next < TOTAL_FRAMES && loadedFrames.has(next)) return images[next];
        }

        return images[0] || null;
      }

      // Render image onto canvas with aspect ratio centering
      function drawImageToCanvas(img) {
        if (!img || !img.complete || img.naturalWidth === 0) return;

        const cw = canvas.width;
        const ch = canvas.height;
        const iw = img.naturalWidth;
        const ih = img.naturalHeight;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, cw, ch);

        // Render at exact actual natural size (no zoom, no crop)
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        // Fit within screen if smaller than image, but NEVER zoom or upscale past actual 1:1 size
        const scale = Math.min(1.0, window.innerWidth / iw, window.innerHeight / ih) * dpr;

        const nw = iw * scale;
        const nh = ih * scale;
        const nx = (cw - nw) / 2;
        const ny = (ch - nh) / 2;

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, iw, ih, nx, ny, nw, nh);
      }

      function renderCurrent() {
        const targetFrameIdx = Math.max(0, Math.min(TOTAL_FRAMES - 1, Math.round(currentProgress * (TOTAL_FRAMES - 1))));
        const img = getBestAvailableImage(targetFrameIdx);
        if (img) {
          drawImageToCanvas(img);
          lastRenderedFrame = targetFrameIdx;
        }
      }

      // Smooth Animation Loop with Linear Interpolation (LERP)
      function animationLoop() {
        // Friction factor (0.1 = smooth Apple-grade momentum)
        const diff = targetProgress - currentProgress;
        if (Math.abs(diff) > 0.0001) {
          currentProgress += diff * 0.1;
          renderCurrent();
        }

        requestAnimationFrame(animationLoop);
      }

      // --- INPUT METHOD 1: Native Window Scroll ---
      function handleScroll() {
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (maxScroll <= 0) return;
        const p = Math.max(0, Math.min(1, window.scrollY / maxScroll));
        targetProgress = p;
      }
      window.addEventListener('scroll', handleScroll, { passive: true });

      // --- INPUT METHOD 2: Desktop Wheel (works anywhere on canvas) ---
      window.addEventListener('wheel', function (e) {
        // Increment scroll position
        const delta = e.deltaY;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (maxScroll > 0) {
          window.scrollBy({ top: delta * 0.8, behavior: 'auto' });
        } else {
          targetProgress = Math.max(0, Math.min(1, targetProgress + (delta * 0.001)));
        }
      }, { passive: true });

      // --- INPUT METHOD 3: Touch Swipe & Drag on Mobile ---
      let touchStartY = 0;
      let touchStartProgress = 0;

      window.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) {
          touchStartY = e.touches[0].clientY;
          touchStartProgress = targetProgress;
        }
      }, { passive: true });

      window.addEventListener('touchmove', function (e) {
        if (e.touches.length === 1) {
          const deltaY = touchStartY - e.touches[0].clientY;
          const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
          if (maxScroll > 0) {
            window.scrollBy({ top: deltaY * 0.15, behavior: 'auto' });
          } else {
            targetProgress = Math.max(0, Math.min(1, touchStartProgress + (deltaY / (window.innerHeight * 1.5))));
          }
        }
      }, { passive: true });

      // --- INPUT METHOD 4: Mouse Click-and-Drag Scrubbing ---
      let isDragging = false;
      let dragStartY = 0;
      let dragStartProgress = 0;

      viewport.addEventListener('mousedown', function (e) {
        isDragging = true;
        dragStartY = e.clientY;
        dragStartProgress = targetProgress;
      });

      window.addEventListener('mousemove', function (e) {
        if (!isDragging) return;
        const deltaY = dragStartY - e.clientY;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (maxScroll > 0) {
          window.scrollBy({ top: deltaY * 0.3, behavior: 'auto' });
        } else {
          targetProgress = Math.max(0, Math.min(1, dragStartProgress + (deltaY / (window.innerHeight * 1.5))));
        }
      });

      window.addEventListener('mouseup', function () {
        isDragging = false;
      });

      // --- SMART PRELOADER ---
      function loadSingleImage(idx, onDone) {
        const img = new Image();
        img.onload = function () {
          images[idx] = img;
          loadedFrames.add(idx);
          if (progressBar) {
            const pct = Math.round((loadedFrames.size / TOTAL_FRAMES) * 100);
            progressBar.style.width = pct + '%';
            if (pct >= 100) {
              setTimeout(() => progressBar.classList.add('loaded'), 250);
            }
          }
          if (onDone) onDone();
        };
        img.onerror = function () {
          console.warn('Could not load frame:', idx);
          if (onDone) onDone();
        };
        img.src = getFrameUrl(idx);
      }

      // Priority 1: Load frame 0 immediately and paint
      loadSingleImage(0, function () {
        resizeCanvas();
        renderCurrent();

        // Priority 2: Keyframe sampling (every 6th frame) for instant responsiveness across the whole range
        let keyframesLoaded = 0;
        const keyframeIndices = [];
        for (let i = 6; i < TOTAL_FRAMES; i += 6) {
          keyframeIndices.push(i);
        }

        keyframeIndices.forEach(idx => {
          loadSingleImage(idx, function () {
            keyframesLoaded++;
            if (keyframesLoaded === keyframeIndices.length) {
              // Priority 3: Fill in all remaining intermediate frames sequentially
              loadAllRemaining();
            }
          });
        });
      });

      function loadAllRemaining() {
        for (let i = 1; i < TOTAL_FRAMES; i++) {
          if (!loadedFrames.has(i)) {
            loadSingleImage(i);
          }
        }
      }

      // Start rendering loop immediately
      resizeCanvas();
      requestAnimationFrame(animationLoop);
    })();
  </script>
</body>
</html>
