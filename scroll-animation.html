<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ameer Suhail — Smooth Scroll Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background-color: #000000;
      color: #ffffff;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background: #000;
    }

    /* Fixed Canvas Viewport (Sticky to Viewport) */
    .canvas-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      z-index: 1;
      pointer-events: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Long Scroll Track for Scrubbing (500vh gives smooth, controlled playback) */
    .scroll-track {
      position: relative;
      height: 500vh;
      width: 100%;
      z-index: 2;
    }

    /* Ultra-minimal Top Loading Progress Bar */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: #cdf863;
      box-shadow: 0 0 12px rgba(205, 248, 99, 0.7);
      z-index: 100;
      transition: width 0.15s ease-out, opacity 0.5s ease;
      pointer-events: none;
    }

    .progress-bar.loaded {
      opacity: 0;
    }
  </style>
</head>
<body>

  <!-- Top Progress Indicator -->
  <div class="progress-bar" id="progressBar"></div>

  <!-- Sticky Fullscreen Canvas -->
  <div class="canvas-viewport">
    <canvas id="portraitCanvas"></canvas>
  </div>

  <!-- Scroll Track -->
  <div class="scroll-track"></div>

  <!-- Lenis Smooth Scroll Engine -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('portraitCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const progressBar = document.getElementById('progressBar');

      const TOTAL_FRAMES = 240;
      const images = new Array(TOTAL_FRAMES);
      let loadedCount = 0;

      // Current interpolated frame & target frame
      let currentFrame = 0;
      let targetFrame = 0;
      let isFirstFrameDrawn = false;

      // Generate file paths: assets/portrait-frames/ezgif-frame-001.jpg -> ezgif-frame-240.jpg
      function getFrameUrl(index) {
        const frameNum = String(index + 1).padStart(3, '0');
        return `assets/portrait-frames/ezgif-frame-${frameNum}.jpg`;
      }

      // High-DPI Canvas Resizing
      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(window.innerWidth * dpr);
        canvas.height = Math.round(window.innerHeight * dpr);
        renderFrame(Math.round(currentFrame));
      }

      window.addEventListener('resize', resizeCanvas, { passive: true });

      // Draw single frame on canvas with aspect ratio centering
      function renderFrame(index) {
        const img = images[index];
        if (!img || !img.complete || img.naturalWidth === 0) return;

        const w = canvas.width;
        const h = canvas.height;
        const imgW = img.naturalWidth;
        const imgH = img.naturalHeight;

        ctx.fillStyle = '#000000';
        ctx.fillRect(0, 0, w, h);

        // Smart fit: Cover slightly on vertical screens, contain on desktop
        const isPortrait = h > w;
        const ratio = isPortrait
          ? Math.max(w / imgW, h / imgH)
          : Math.min(w / imgW, h / imgH);

        const nw = imgW * ratio;
        const nh = imgH * ratio;
        const nx = (w - nw) / 2;
        const ny = (h - nh) / 2;

        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, 0, 0, imgW, imgH, nx, ny, nw, nh);
      }

      // Smooth Animation Loop using Linear Interpolation (LERP)
      function updateLoop() {
        // Smooth easing towards targetFrame (0.09 factor creates buttery inertia)
        const diff = targetFrame - currentFrame;
        if (Math.abs(diff) > 0.001) {
          currentFrame += diff * 0.09;
          renderFrame(Math.round(currentFrame));
        }

        requestAnimationFrame(updateLoop);
      }

      // Scroll Event Listener: maps scroll progress 0..1 to frame 0..239
      function onScroll(e) {
        const scrollY = (e && typeof e.scroll === 'number') ? e.scroll : window.scrollY;
        const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
        if (maxScroll <= 0) return;

        const scrollFraction = Math.max(0, Math.min(1, scrollY / maxScroll));
        targetFrame = Math.min(TOTAL_FRAMES - 1, Math.max(0, Math.round(scrollFraction * (TOTAL_FRAMES - 1))));
      }

      window.addEventListener('scroll', onScroll, { passive: true });

      // Initialize Lenis Smooth Scroll
      if (typeof Lenis !== 'undefined') {
        const lenis = new Lenis({
          duration: 1.2,
          easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
          smoothWheel: true,
          touchMultiplier: 1.5,
        });

        function raf(time) {
          lenis.raf(time);
          requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        lenis.on('scroll', onScroll);
      }

      // Progressive Preloader
      // 1. Load frame 1 immediately and draw as fast as possible
      const firstImg = new Image();
      firstImg.onload = function () {
        images[0] = firstImg;
        loadedCount++;
        if (!isFirstFrameDrawn) {
          resizeCanvas();
          renderFrame(0);
          isFirstFrameDrawn = true;
        }
      };
      firstImg.src = getFrameUrl(0);

      // 2. Preload remaining frames
      for (let i = 1; i < TOTAL_FRAMES; i++) {
        const img = new Image();
        const frameIdx = i;
        img.onload = function () {
          images[frameIdx] = img;
          loadedCount++;

          // Update progress bar
          const pct = Math.round((loadedCount / TOTAL_FRAMES) * 100);
          if (progressBar) {
            progressBar.style.width = pct + '%';
            if (pct >= 100) {
              setTimeout(() => progressBar.classList.add('loaded'), 200);
            }
          }

          // If current target frame just finished loading, re-render
          if (Math.round(currentFrame) === frameIdx) {
            renderFrame(frameIdx);
          }
        };
        img.src = getFrameUrl(i);
      }

      // Initialize
      resizeCanvas();
      requestAnimationFrame(updateLoop);
    })();
  </script>
</body>
</html>
